name: Feature Branch CI

# Trigger:
# - Runs on every non-draft pull request when opened, updated, reopened,
#   or marked ready for review.
# - Purpose: give reviewers fast feedback before a PR is merged.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  fast-feedback:
    if: github.event.pull_request.draft == false
    name: Fast Feedback (static)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm

      - name: 3. Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 4. Lint
        run: npm run lint

      - name: 5. Unit Tests
        run: npm run test:ci
